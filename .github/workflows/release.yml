name: Release

# Push a tag such as v0.1.8 (it must equal the version in Cargo.toml) to build an Apple silicon dmg and
# a universal (Apple silicon + Intel) dmg and create a draft release; review the notes on GitHub and
# publish it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, e.g. v0.1.8
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Apple silicon and universal dmgs, draft release
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Tag must match the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="shellmate"))')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: universal-release

      # Releases are signed with the project's self-signed certificate so that keychain access and the
      # in-app updater keep trusting new versions (docs/signing.md).
      - name: Import the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            echo "::error::Add the SIGNING_CERT_P12 and SIGNING_CERT_PASSWORD repository secrets (docs/signing.md)"
            exit 1
          fi
          if ! requirement=$(scripts/signing-requirement.sh); then
            echo "::error::crates/shellmate/assets/signing/trusted-certificates.txt must list the signing certificate (docs/signing.md)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          {
            echo "SIGN_IDENTITY=Shellmate Code Signing"
            echo "SIGN_KEYCHAIN=$keychain"
            echo "SIGN_REQUIREMENT=$requirement"
          } >> "$GITHUB_ENV"

      - name: Build the universal app and dmg
        run: scripts/bundle-macos.sh release --universal

      - name: Verify the universal bundle
        run: |
          app=target/release/Shellmate.app
          lipo -info "$app/Contents/MacOS/Shellmate"
          lipo "$app/Contents/MacOS/Shellmate" -verify_arch arm64 x86_64
          appex="$app/Contents/PlugIns/ShellmateFinder.appex"
          test -d "$appex"
          lipo "$appex/Contents/MacOS/ShellmateFinder" -verify_arch arm64 x86_64
          codesign --verify --strict "$appex"
          for arch in arm64 x86_64; do
            test "$(codesign -d --xml --arch "$arch" --entitlements - "$appex" | plutil -extract 'com\.apple\.security\.app-sandbox' raw -expect bool -)" = true
          done
          codesign --verify --deep --strict -R="$SIGN_REQUIREMENT" "$app"
          hdiutil verify "target/release/Shellmate-$VERSION-universal.dmg"

      # Reuses the Rust arm64 binary from the universal build.
      - name: Build the Apple silicon app and dmg
        run: scripts/bundle-macos.sh release --arm64

      - name: Verify the Apple silicon bundle
        run: |
          app=target/release/Shellmate.app
          lipo -info "$app/Contents/MacOS/Shellmate"
          if [ "$(lipo -archs "$app/Contents/MacOS/Shellmate")" != arm64 ]; then
            echo "::error::The Apple silicon build must contain only arm64"
            exit 1
          fi
          vtool -show-build "$app/Contents/MacOS/Shellmate" | grep -Eq 'minos 13\.0$'
          appex="$app/Contents/PlugIns/ShellmateFinder.appex"
          test -d "$appex"
          lipo "$appex/Contents/MacOS/ShellmateFinder" -verify_arch arm64
          test "$(lipo -archs "$appex/Contents/MacOS/ShellmateFinder")" = arm64
          codesign --verify --strict "$appex"
          test "$(codesign -d --xml --entitlements - "$appex" | plutil -extract 'com\.apple\.security\.app-sandbox' raw -expect bool -)" = true
          codesign --verify --deep --strict -R="$SIGN_REQUIREMENT" "$app"
          hdiutil verify "target/release/Shellmate-$VERSION-arm64.dmg"

      - name: Checksums
        working-directory: target/release
        run: |
          for arch in arm64 universal; do
            shasum -a 256 "Shellmate-$VERSION-$arch.dmg" | tee "Shellmate-$VERSION-$arch.dmg.sha256"
          done

      - name: Release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          sha_arm64=$(cut -d' ' -f1 "target/release/Shellmate-$VERSION-arm64.dmg.sha256")
          sha_universal=$(cut -d' ' -f1 "target/release/Shellmate-$VERSION-universal.dmg.sha256")
          {
            echo "## 更新内容"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..$TAG" | grep -v '^- chore: 版本号' || true
            else
              echo "- 首个公开版本，功能介绍见 README。"
            fi
            echo
            echo "## 下载"
            echo
            echo "| 文件 | 适用于 |"
            echo "|---|---|"
            echo "| \`Shellmate-$VERSION-arm64.dmg\` | Apple 芯片（M1 及以后）的 Mac，推荐，体积更小 |"
            echo "| \`Shellmate-$VERSION-universal.dmg\` | Intel 处理器的 Mac；也可在 Apple 芯片上使用 |"
            echo
            echo "两个版本都需要 macOS 13 及以上。打开 dmg，把 Shellmate 拖进「应用程序」。已安装 0.1.9 及以上版本时，也可以在菜单「Shellmate › 检查更新…」中直接更新。"
            echo
            echo "这个版本没有 Apple 开发者签名，第一次打开时 macOS 会提示无法验证开发者："
            echo
            echo "- macOS 15 及以上：打开「系统设置 → 隐私与安全性」，在页面下方找到 Shellmate，点「仍要打开」并确认；"
            echo "- macOS 13 / 14：在「应用程序」里右键 Shellmate → 打开；"
            echo "- 若提示「已损坏，无法打开」，在终端执行下面这行后再打开："
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine /Applications/Shellmate.app'
            echo '```'
            echo
            echo "SHA-256："
            echo
            echo "- \`Shellmate-$VERSION-arm64.dmg\`：\`$sha_arm64\`"
            echo "- \`Shellmate-$VERSION-universal.dmg\`：\`$sha_universal\`"
          } > notes.md
          cat notes.md

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for arch in arm64 universal; do
            files+=("target/release/Shellmate-$VERSION-$arch.dmg" "target/release/Shellmate-$VERSION-$arch.dmg.sha256")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag \
              --title "Shellmate $VERSION" --notes-file notes.md
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
