name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy and tests (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The Finder extension is Swift and outside the cargo workspace, so cargo never checks it.
      # Compile both slices here so a broken change fails on push rather than at release time.
      - name: Finder extension (Swift)
        run: |
          scripts/build-finder-extension.sh "$RUNNER_TEMP/ShellmateFinder" arm64 x86_64
          lipo "$RUNNER_TEMP/ShellmateFinder" -verify_arch arm64 x86_64
          plutil -lint macos/FinderExtension/Info.plist macos/FinderExtension/ShellmateFinder.entitlements

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Tests that need a real OpenSSH server, Docker or the keychain are #[ignore]d.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log

      # Failing test names and panic locations as annotations on the run summary.
      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          grep -E '^test .* FAILED$|panicked at|^error' test.log | head -40 | while IFS= read -r line; do
            echo "::error title=Test failure::$line"
          done
