[workspace]
resolver = "3"
members = ["crates/*"]
# vendored crates are built as dependencies, not linted or tested with the workspace
exclude = ["vendor/russh"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serialport = "4.7"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-local-authentication = "0.3"
block2 = "0.6"
shellmate-telnet = { path = "crates/shellmate-telnet" }
shellmate-serial = { path = "crates/shellmate-serial" }
shellmate-core = { path = "crates/shellmate-core" }
shellmate-term = { path = "crates/shellmate-term" }
shellmate-ssh = { path = "crates/shellmate-ssh" }
shellmate-vault = { path = "crates/shellmate-vault" }
shellmate-ai = { path = "crates/shellmate-ai" }
shellmate-store = { path = "crates/shellmate-store" }
shellmate-sftp = { path = "crates/shellmate-sftp" }
shellmate-forward = { path = "crates/shellmate-forward" }
shellmate-monitor = { path = "crates/shellmate-monitor" }

gpui = { package = "gpui-kit", version = "0.9.1", features = ["syntect"] }
libc = "0.2"
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
async-channel = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
russh = "0.65"
russh-sftp = "3.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
async-trait = "0.1"
thiserror = "2"
zeroize = "1"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
tempfile = "3"
futures = "0.3"
similar = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
keyring = "4.2"
# keyring-core is what keyring 4 wraps; needed for Entry::search (enumerating our own items)
keyring-core = "1"
# AI assistant (P7 M5): multi-provider LLM client, user-chosen; exact pin because its API moves fast
rig-core = { version = "=0.46.0", default-features = false, features = ["reqwest", "rustls"] }

# russh with per-channel flow control (see vendor/russh/SHELLMATE-PATCH.md)
[patch.crates-io]
russh = { path = "vendor/russh" }

# Keep interactive KDF calibration representative in debug builds, too. Never
# lower password-hardening work merely to compensate for unoptimized Rust loops.
[profile.dev.package.argon2]
opt-level = 3
