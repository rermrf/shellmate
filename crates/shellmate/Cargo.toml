[package]
name = "shellmate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures.workspace = true
shellmate-ai.workspace = true
shellmate-vault.workspace = true
zeroize.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"
encoding_rs = "0.8"
semver = "1"
sha2 = "0.11"
hex = "0.4"
shellmate-telnet.workspace = true
shellmate-serial.workspace = true
shellmate-core.workspace = true
shellmate-term.workspace = true
shellmate-store.workspace = true
shellmate-ssh.workspace = true
shellmate-sftp.workspace = true
shellmate-forward.workspace = true
shellmate-monitor.workspace = true
async-channel.workspace = true
async-trait.workspace = true
tokio.workspace = true
gpui.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = ["NSScreen", "NSWorkspace", "NSView", "NSWindow", "NSStatusBar", "NSStatusItem",
    "NSStatusBarButton", "NSDockTile", "NSButton", "NSControl", "NSCell", "NSEvent", "NSMenu", "NSMenuItem",
    "NSImageRep", "NSBitmapImageRep", "objc2-core-foundation"] }
# GPUI already uses this locked crate for its Window handle.
raw-window-handle = "0.6.2"
similar.workspace = true
tempfile.workspace = true
# Already used by gpui-component; reuse the locked parser for safe Markdown preprocessing.
markdown = "=1.0.0"
# Already locked by GPUI; column indexing for virtualized literal command output.
unicode-width = "=0.2.3"

[dev-dependencies]
rusqlite.workspace = true
rig-core = { workspace = true, features = ["test-utils"] }
shellmate-core = { workspace = true, features = ["test-support"] }
